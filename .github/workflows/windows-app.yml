# Builds the Windows installer. It has to run on a real Windows machine, so GitHub does it.
# Download the result from the run's "Artifacts" section, or from the Release on a tag.
name: Windows app

on:
  push:
    branches: [main, circuit-brain-foundation]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Never ship an installer built from code that does not pass its own tests.
      - run: npm test

      # app:pack runs the typecheck, builds the web app into dist/, then packages it.
      - name: Build the installer
        run: npm run app:pack

      - uses: actions/upload-artifact@v4
        with:
          name: CircuitBrain-Windows-Setup
          path: release/*.exe
          if-no-files-found: error

      # Publishing from CI rather than from a pushed tag: the workflow's own token can
      # create the tag and release, and it means every build keeps the download link fresh.
      - name: Publish the installer as a release
        shell: bash
        run: |
          set -euo pipefail
          ls -la release/*.exe
          TAG="v$(node -p "require('./package.json').version")"
          NOTES=$'Windows installer for Circuit Brain. No Node.js or terminal needed.\n\nIt is not code-signed, so Windows SmartScreen warns the first time. Either click **More info -> Run anyway**, or right-click the downloaded file, choose **Properties**, tick **Unblock**, press OK, and run it.\n\nBuilt from `'"$GITHUB_SHA"$'`.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing the installer."
            gh release upload "$TAG" release/*.exe --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            echo "Creating release $TAG."
            gh release create "$TAG" release/*.exe \
              --target "$GITHUB_SHA" \
              --title "Circuit Brain $TAG" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
        env:
          GH_TOKEN: ${{ github.token }}
